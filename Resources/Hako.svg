    <line x1="512.0" y1="541.4" x2="758.8" y2="398.9" stroke="#F3D3A3" stroke-width="4" stroke-linecap="round"/>
    <line x1="512.0" y1="541.4" x2="512.0" y2="803.6" stroke="#B07639" stroke-width="3" stroke-linecap="round"/>
    <polygon points="265.2,661.1 512.0,803.6 758.8,661.1 758.8,398.9 512.0,256.4 265.2,398.9" fill="none" stroke="#7E5226" stroke-opacity="0.55" stroke-width="4"/>
